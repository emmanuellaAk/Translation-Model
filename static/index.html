
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English ↔ Twi Translation</title>
<style>
  :root {
    --navy: #002d5d;
    --navy-soft: #1c4a7a;
    --gold: #d0aa66;
    --gold-deep: #8a6d2f;
    --page: #e9eef4;
    --sheet: #ffffff;
    --wash: #f2f5f9;
    --line: #cfd8e3;
    --ink: #1b2633;
    --muted: #596779;
    --error: #a3262a;

    --sans: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --serif: Charter, "Bitstream Charter", "Iowan Old Style", Georgia, "Times New Roman", serif;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
  }

  .wrap { max-width: 980px; margin: 0 auto; padding: 0 24px; }

  /* ---------- header ---------- */
  header.top {
    background: var(--navy);
    border-bottom: 3px solid var(--gold);
    color: #fff;
    padding: 34px 0 30px;
  }
  header.top h1 {
    margin: 0 0 8px;
    font-family: var(--serif);
    font-weight: 700;
    font-size: clamp(26px, 4.2vw, 36px);
    line-height: 1.15;
    letter-spacing: 0.005em;
  }
  header.top p {
    margin: 0;
    max-width: 56ch;
    color: #c9d6e6;
    font-size: 16px;
  }

  main.wrap { padding-top: 32px; padding-bottom: 44px; }

  /* ---------- input sheet ---------- */
  .sheet {
    background: var(--sheet);
    border: 1px solid var(--line);
    border-radius: 6px;
  }

  .route {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    font-weight: 600;
  }
  .route .lang { min-width: 76px; }
  .route .lang.to { color: var(--navy); }
  .swap {
    display: inline-grid;
    place-items: center;
    width: 36px; height: 36px;
    padding: 0;
    margin: 0 6px;
    background: var(--wash);
    border: 1px solid var(--line);
    border-radius: 50%;
    color: var(--navy);
    cursor: pointer;
  }
  .swap:hover { background: #e3eaf3; }
  .swap svg { width: 18px; height: 18px; display: block; transition: transform .25s ease; }
  .swap.flipped svg { transform: rotate(180deg); }

  .field { padding: 6px 20px 0; }
  .field label.sr {
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }
  textarea {
    display: block;
    width: 100%;
    min-height: 118px;
    padding: 12px 0 8px;
    border: 0;
    background: transparent;
    resize: vertical;
    color: var(--ink);
    font-family: var(--serif);
    font-size: 21px;
    line-height: 1.5;
  }
  textarea::placeholder { color: #8d99a9; }
  textarea:focus { outline: none; }
  .field:focus-within { box-shadow: inset 0 -2px 0 var(--navy); }

  .tools {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px 16px;
    padding: 12px 20px 16px;
  }
  .letters { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; }
  .letters button {
    width: 34px; height: 34px;
    padding: 0;
    background: var(--wash);
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--ink);
    font-family: var(--serif);
    font-size: 18px;
    cursor: pointer;
  }
  .letters button:hover { background: #e3eaf3; }
  .count { margin-left: auto; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }

  .go {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px 20px;
    padding: 14px 20px;
    background: var(--wash);
    border-top: 1px solid var(--line);
    border-radius: 0 0 6px 6px;
  }
  button.primary {
    background: var(--navy);
    color: #fff;
    border: 0;
    border-radius: 4px;
    padding: 12px 22px;
    font: 600 16px/1 var(--sans);
    cursor: pointer;
  }
  button.primary:hover { background: var(--navy-soft); }
  button.primary:disabled { background: #7d8b9c; cursor: default; }
  .hint { color: var(--muted); font-size: 14px; }

  /* ---------- comparison ---------- */
  .compare {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    margin-top: 24px;
    background: var(--sheet);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
  }
  .side { position: relative; display: flex; flex-direction: column; min-height: 250px; border-top: 3px solid var(--line); }
  .side.original { background: var(--wash); border-right: 1px solid var(--line); border-top-color: #9aa8b9; }
  .side.tuned { border-top-color: var(--gold); }

  .side header { padding: 16px 20px 0; }
  .side h2 { margin: 0; font-size: 17px; font-weight: 700; color: var(--navy); }
  .side header p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }

  .out {
    flex: 1;
    margin: 0;
    padding: 18px 20px 12px;
    font-family: var(--serif);
    font-size: 22px;
    line-height: 1.5;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }
  .out.empty { color: #8d99a9; font-size: 17px; font-family: var(--sans); }
  .out.failed { color: var(--error); font-family: var(--sans); font-size: 16px; }

  .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 48px;
    padding: 8px 20px 14px;
    color: var(--muted);
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }
  .copy {
    padding: 6px 12px;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--navy);
    font: 600 14px/1 var(--sans);
    cursor: pointer;
  }
  .copy:hover { background: #e3eaf3; }
  .copy[hidden] { display: none; }

  .bar { position: absolute; left: 0; right: 0; top: -3px; height: 3px; overflow: hidden; display: none; }
  .loading .bar { display: block; }
  .bar::after {
    content: "";
    position: absolute; inset: 0 auto 0 0; width: 35%;
    background: var(--navy);
    animation: sweep 1.1s ease-in-out infinite;
  }
  @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(300%); } }

  /* ---------- focus + motion + small screens ---------- */
  button:focus-visible, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    .bar::after { animation: none; width: 100%; opacity: .35; }
    .swap svg { transition: none; }
  }
  @media (max-width: 720px) {
    .wrap { padding: 0 16px; }
    header.top { padding: 26px 0 22px; }
    .compare { grid-template-columns: 1fr; }
    .side { min-height: 0; }
    .side.original { border-right: 0; border-bottom: 1px solid var(--line); }
    .count { margin-left: 0; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <h1>English ↔ Twi Translation</h1>
  </div>
</header>

<main class="wrap">

  <section class="sheet" aria-label="Sentence to translate">
    <div class="route" role="group" aria-label="Translation direction">
      <span class="lang" id="from-lang">English</span>
      <button type="button" class="swap" id="swap" aria-label="Swap translation direction" title="Swap direction">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 8h15"/><path d="M15 4l4 4-4 4"/><path d="M20 16H5"/><path d="M9 12l-4 4 4 4"/>
        </svg>
      </button>
      <span class="lang to" id="to-lang">Twi</span>
    </div>

    <div class="field">
      <label class="sr" for="input" id="input-label">Text in English</label>
      <textarea id="input" rows="3" placeholder="Type a sentence in English"></textarea>
    </div>

    <div class="tools">
      <div class="letters" role="group" aria-label="Insert Twi letters">
        <span>Twi letters</span>
        <button type="button" data-ch="ɛ" aria-label="Insert ɛ">ɛ</button>
        <button type="button" data-ch="ɔ" aria-label="Insert ɔ">ɔ</button>
        <button type="button" data-ch="Ɛ" aria-label="Insert capital Ɛ">Ɛ</button>
        <button type="button" data-ch="Ɔ" aria-label="Insert capital Ɔ">Ɔ</button>
      </div>
      <span class="count" id="count" aria-live="off">0 characters</span>
    </div>

    <div class="go">
      <button type="button" class="primary" id="submit">Translate with both models</button>
      <span class="hint">Ctrl + Enter also works</span>
    </div>
  </section>

  <section class="compare" aria-label="Translations" aria-live="polite">
    <article class="side original" id="base-side">
      <div class="bar"></div>
      <header>
        <h2>Original model</h2>
        <p>NLLB-200 distilled 600M, as released</p>
      </header>
      <p class="out empty" id="base-out">The original model's translation will appear here.</p>
      <div class="foot">
        <span id="base-time"></span>
        <button type="button" class="copy" id="base-copy" data-target="base-out" hidden>Copy</button>
      </div>
    </article>

    <article class="side tuned" id="ft-side">
      <div class="bar"></div>
      <header>
        <h2>Fine-tuned model</h2>
        <p>Trained further on Asante Twi</p>
      </header>
      <p class="out empty" id="ft-out">The fine-tuned model's translation will appear here.</p>
      <div class="foot">
        <span id="ft-time"></span>
        <button type="button" class="copy" id="ft-copy" data-target="ft-out" hidden>Copy</button>
      </div>
    </article>
  </section>

</main>

<script>
  const $ = (id) => document.getElementById(id);
  const input = $('input');
  const submit = $('submit');
  let direction = 'en2tw';
  let busy = false;

  const SUBMIT_LABEL = 'Translate with both models';

  /* ----- direction ----- */
  function setDirection(dir) {
    direction = dir;
    const fromEnglish = dir === 'en2tw';
    $('from-lang').textContent = fromEnglish ? 'English' : 'Twi';
    $('to-lang').textContent = fromEnglish ? 'Twi' : 'English';
    $('input-label').textContent = 'Text in ' + (fromEnglish ? 'English' : 'Twi');
    input.placeholder = 'Type a sentence in ' + (fromEnglish ? 'English' : 'Twi');
    input.lang = fromEnglish ? 'en' : 'tw';
    $('swap').classList.toggle('flipped', !fromEnglish);
  }
  $('swap').addEventListener('click', () => setDirection(direction === 'en2tw' ? 'tw2en' : 'en2tw'));

  /* ----- input helpers ----- */
  function updateCount() {
    const n = input.value.length;
    $('count').textContent = n + (n === 1 ? ' character' : ' characters');
  }
  input.addEventListener('input', updateCount);

  document.querySelectorAll('.letters button').forEach((b) => {
    b.addEventListener('click', () => {
      const ch = b.dataset.ch;
      const s = input.selectionStart, e = input.selectionEnd;
      input.value = input.value.slice(0, s) + ch + input.value.slice(e);
      input.focus();
      input.setSelectionRange(s + ch.length, s + ch.length);
      updateCount();
    });
  });

  input.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') runTranslate();
  });
  submit.addEventListener('click', runTranslate);

  /* ----- output helpers ----- */
  const sides = [
    { side: 'base-side', out: 'base-out', time: 'base-time', copy: 'base-copy' },
    { side: 'ft-side',   out: 'ft-out',   time: 'ft-time',   copy: 'ft-copy'   },
  ];

  function formatTime(ms) {
    if (ms == null || isNaN(ms)) return '';
    return ms >= 1000 ? (ms / 1000).toFixed(1) + ' s' : Math.round(ms) + ' ms';
  }

  function showLoading(on) {
    sides.forEach((s) => $(s.side).classList.toggle('loading', on));
  }

  function setOutput(key, text, state) {
    const s = sides.find((x) => x.out === key);
    const el = $(s.out);
    el.textContent = text;
    el.className = 'out' + (state ? ' ' + state : '');
    el.lang = state ? '' : (direction === 'en2tw' ? 'tw' : 'en');
    $(s.copy).hidden = state !== undefined;
  }

  function resetForRun() {
    sides.forEach((s) => {
      $(s.time).textContent = '';
      $(s.copy).hidden = true;
      const el = $(s.out);
      el.className = 'out empty';
      el.textContent = 'Translating…';
    });
  }

  /* ----- translate ----- */
  async function runTranslate() {
    const text = input.value.trim();
    if (!text || busy) return;
    busy = true;
    submit.disabled = true;
    submit.textContent = 'Translating…';
    resetForRun();
    showLoading(true);

    try {
      const r = await fetch('/translate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, direction }),
      });
      let data = null;
      try { data = await r.json(); } catch (_) { /* non-JSON response */ }

      if (!r.ok || !data || data.error) {
        const msg = (data && data.error) || ('The server returned an error (' + r.status + '). Try again.');
        setOutput('base-out', msg, 'failed');
        setOutput('ft-out', msg, 'failed');
      } else {
        setOutput('base-out', data.base ?? '');
        setOutput('ft-out', data.fine_tuned ?? '');
        $('base-time').textContent = formatTime(data.base_time_ms);
        $('ft-time').textContent = formatTime(data.ft_time_ms);
      }
    } catch (e) {
      const msg = 'Could not reach the translation server. Check that the backend is running, then try again.';
      setOutput('base-out', msg, 'failed');
      setOutput('ft-out', msg, 'failed');
    } finally {
      showLoading(false);
      busy = false;
      submit.disabled = false;
      submit.textContent = SUBMIT_LABEL;
    }
  }

  /* ----- copy ----- */
  document.querySelectorAll('.copy').forEach((b) => {
    b.addEventListener('click', async () => {
      const text = $(b.dataset.target).textContent;
      try {
        await navigator.clipboard.writeText(text);
      } catch (_) {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch (__) {}
        ta.remove();
      }
      b.textContent = 'Copied';
      setTimeout(() => { b.textContent = 'Copy'; }, 1500);
    });
  });

  setDirection('en2tw');
  updateCount();
</script>
</body>
</html>
